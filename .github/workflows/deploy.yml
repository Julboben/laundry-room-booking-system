name: Deploy

# Manual-only deployment. This workflow is never triggered
# automatically so that production deployments always require an
# explicit decision.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to deploy main to production.'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "You must type 'deploy' to confirm this run." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build deployment artifact
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='storage/backups' \
            --exclude='storage/logs' \
            --exclude='tests' \
            --exclude='dist' \
            ./ dist/
          mkdir -p dist/storage/backups dist/storage/logs
          touch dist/storage/backups/.gitkeep dist/storage/logs/.gitkeep

      - name: Deploy over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          local_path: 'dist/*'
          remote_path: ${{ secrets.DEPLOY_REMOTE_PATH }}
          sftpArgs: '-o ConnectTimeout=30'
